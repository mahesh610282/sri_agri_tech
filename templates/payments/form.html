
{% extends "base.html" %}
{% block content %}
<h2>Record Payment</h2>
<div class="alert alert-info">Bill {{ bill.bill_number }} — Remaining ₹{{ bill.remaining_amount }}</div>
<form method="post" class="card card-body">{% csrf_token %}
<label>Amount</label><input name="amount" type="number" step="0.01" min="0.01" max="{{ bill.remaining_amount }}" class="form-control mb-3" required>
<label>Payment Method</label>
<select name="payment_method" class="form-select mb-3">
<option value="CASH">Cash</option><option value="UPI">UPI</option><option value="BANK">Bank Transfer</option><option value="CARD">Card</option><option value="OTHER">Other</option>
</select>
<label>Reference Number</label><input name="reference_number" class="form-control mb-3">
<label>Notes</label><textarea name="notes" class="form-control mb-3"></textarea>
<button class="btn btn-success">Save Payment</button>
</form>
{% endblock %}
