{% extends "base.html" %}

{% load static %}

{% block content %}

<div class="container">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h2 class="fw-bold">Create Bill</h2>
            <p class="text-muted mb-0">
                Create a new customer invoice
            </p>
        </div>

        <a
            href="{% url 'billing:payment' %}"
            class="btn btn-outline-success"
        >
            Record Customer Payment
        </a>

    </div>


    <form method="post" id="bill-form">

        {% csrf_token %}


        <!-- CUSTOMER -->

        <div class="card shadow-sm border-0 mb-4">

            <div class="card-header bg-success text-white">
                <strong>Customer</strong>
            </div>

            <div class="card-body">

                <label class="form-label">
                    Customer
                </label>

                <select
                    name="customer_id"
                    class="form-select"
                    required
                >

                    <option value="">
                        Select Customer
                    </option>

                    {% for c in customers %}

                    <option value="{{ c.id }}">

                        {{ c.mobile }}
                        -
                        {{ c.name }}

                        | Outstanding ₹
                        {{ c.outstanding_balance }}

                    </option>

                    {% endfor %}

                </select>

            </div>

        </div>


        <!-- PRODUCTS -->

        <div class="card shadow-sm border-0 mb-4">

            <div class="card-header bg-success text-white">

                <strong>Products</strong>

            </div>

            <div class="card-body">

                <div id="items">

                    <div class="row g-2 item-row mb-3">

                        <div class="col-md-7">

                            <select
                                name="product_id[]"
                                class="form-select product-select"
                                required
                            >

                                <option value="">
                                    Select product
                                </option>

                                {% for p in products %}

                                <option
                                    value="{{ p.id }}"
                                    data-price="{{ p.selling_price }}"
                                    data-stock="{{ p.stock_quantity }}"
                                >

                                    {{ p.name }}

                                    —
                                    ₹{{ p.selling_price }}

                                    —
                                    Stock:
                                    {{ p.stock_quantity }}

                                </option>

                                {% endfor %}

                            </select>

                        </div>


                        <div class="col-md-3">

                            <input
                                name="quantity[]"
                                class="form-control quantity"
                                type="number"
                                step="0.001"
                                min="0.001"
                                placeholder="Quantity"
                                required
                            >

                        </div>


                        <div class="col-md-2">

                            <button
                                type="button"
                                class="btn btn-outline-danger remove"
                            >
                                Remove
                            </button>

                        </div>

                    </div>

                </div>


                <button
                    type="button"
                    id="add-item"
                    class="btn btn-outline-success"
                >
                    + Add Product
                </button>

            </div>

        </div>


        <!-- BILL SUMMARY -->

        <div class="card shadow-sm border-0">

            <div class="card-header bg-light">

                <strong>Bill Summary</strong>

            </div>

            <div class="card-body">

                <div class="row g-3">

                    <div class="col-md-4">

                        <label class="form-label">
                            Discount
                        </label>

                        <input
                            name="discount"
                            id="discount"
                            value="0"
                            class="form-control"
                            type="number"
                            step="0.01"
                            min="0"
                        >

                    </div>


                    <div class="col-md-4">

                        <label class="form-label">
                            Customer Payment
                        </label>

                        <input
                            name="paid_amount"
                            value="0"
                            class="form-control"
                            type="number"
                            step="0.01"
                            min="0"
                        >

                        <small class="text-muted">
                            This can settle previous outstanding bills also.
                        </small>

                    </div>


                    <div class="col-md-4">

                        <label class="form-label">
                            Estimated New Bill Total
                        </label>

                        <input
                            id="grand-total"
                            class="form-control"
                            readonly
                        >

                    </div>


                    <div class="col-md-6">

                        <label class="form-label">
                            Payment Method
                        </label>

                        <select
                            name="payment_method"
                            class="form-select"
                        >

                            <option value="CASH">
                                Cash
                            </option>

                            <option value="UPI">
                                UPI
                            </option>

                            <option value="BANK">
                                Bank Transfer
                            </option>

                            <option value="CARD">
                                Card
                            </option>

                            <option value="OTHER">
                                Other
                            </option>

                        </select>

                    </div>


                    <div class="col-md-6">

                        <label class="form-label">
                            Reference Number
                        </label>

                        <input
                            name="reference_number"
                            class="form-control"
                            placeholder="UPI / transaction reference"
                        >

                    </div>


                    <div class="col-12">

                        <label class="form-label">
                            Notes
                        </label>

                        <textarea
                            name="notes"
                            class="form-control"
                            rows="2"
                        ></textarea>

                    </div>

                </div>


                <button
                    type="submit"
                    class="btn btn-success btn-lg mt-4"
                >
                    Generate Bill
                </button>

            </div>

        </div>

    </form>

</div>


<script src="{% static 'js/billing.js' %}"></script>

{% endblock %}
