{% extends "base.html" %}

{% block content %}

<div class="container">

    <div class="mb-4">

        <h2 class="fw-bold">
            Customer Payment
        </h2>

        <p class="text-muted">
            Collect payment against previous outstanding bills.
        </p>

    </div>


    <form method="post">

        {% csrf_token %}


        <div class="card shadow-sm border-0">

            <div class="card-body">

                <div class="mb-3">

                    <label class="form-label">
                        Customer
                    </label>

                    <select
                        name="customer_id"
                        class="form-select"
                        required
                    >

                        <option value="">
                            Select Customer
                        </option>

                        {% for customer in customers %}

                        <option value="{{ customer.id }}">

                            {{ customer.mobile }}
                            -
                            {{ customer.name }}

                            | Outstanding ₹
                            {{ customer.outstanding_balance }}

                        </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Payment Amount
                    </label>

                    <input
                        name="amount"
                        type="number"
                        step="0.01"
                        min="0.01"
                        class="form-control"
                        required
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Payment Method
                    </label>

                    <select
                        name="payment_method"
                        class="form-select"
                    >

                        <option value="CASH">
                            Cash
                        </option>

                        <option value="UPI">
                            UPI
                        </option>

                        <option value="BANK">
                            Bank Transfer
                        </option>

                        <option value="CARD">
                            Card
                        </option>

                        <option value="OTHER">
                            Other
                        </option>

                    </select>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Reference Number
                    </label>

                    <input
                        name="reference_number"
                        class="form-control"
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Notes
                    </label>

                    <textarea
                        name="notes"
                        class="form-control"
                        rows="3"
                    ></textarea>

                </div>


                <button class="btn btn-success">
                    Save Payment
                </button>

            </div>

        </div>

    </form>

</div>

{% endblock %}
